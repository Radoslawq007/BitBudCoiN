<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peery — BitBudCoin</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="page">
    <h1 style="margin-top:32px;" data-i18n="peers_h1">Peery P2P</h1>

    <div class="grid cols-2">
        <div class="card">
            <h3 data-i18n="peers_connect_heading">Połącz z nowym peerem</h3>
            <div class="field">
                <label for="peer-address" data-i18n="peers_address_label">Adres (host:port)</label>
                <input id="peer-address" placeholder="203.0.113.10:6001">
            </div>
            <button class="btn" id="connect-btn" data-i18n="peers_connect_btn">Połącz</button>
            <div id="connect-result" style="margin-top:12px;"></div>
        </div>
        <div class="card">
            <h3 data-i18n="peers_status_heading">Status węzła</h3>
            <div id="peers-summary"><p class="skeleton">ładowanie ładowanie</p></div>
        </div>
    </div>

    <div class="grid cols-3" style="margin-top:20px;">
        <div class="card"><h3 data-i18n="peers_connected_heading">Połączeni</h3><ul id="list-connected" class="mono" style="padding-left:18px; margin:0;"></ul></div>
        <div class="card"><h3 data-i18n="peers_configured_heading">Skonfigurowani</h3><ul id="list-configured" class="mono" style="padding-left:18px; margin:0;"></ul></div>
        <div class="card"><h3 data-i18n="peers_reconnecting_heading">Łączą się ponownie</h3><ul id="list-reconnecting" class="mono" style="padding-left:18px; margin:0;"></ul></div>
    </div>
</div>

<footer><span data-i18n="footer_text">BitBudCoin (BbC) · sieć proof-of-work</span> · <a href="docks.html" data-i18n="footer_docs_link">dokumentacja</a></footer>

<script src="assets/api.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/native-responsive.js"></script>
<script src="assets/i18n.js"></script>
<script>
setActiveNav("nav-peers");

function fillList(id, items) {
    const el = document.getElementById(id);
    el.innerHTML = items.length ? items.map(p => `<li>${escapeHtml(p)}</li>`).join("") : `<li style="color:var(--text-dim); list-style:none; margin-left:-18px;">${t("peers_none")}</li>`;
}

// vMax: dane peerów teraz z BBCLiveState (SSE + fallback /state) zamiast
// własnego setInterval(load, 10000) - ten sam mechanizm co reszta stron,
// jeden punkt prawdy, nie osobne odpytywanie z każdej strony osobno.
function renderPeers(state) {
    const p = state.p2p || {};
    const connected = p.connected || [];
    const configured = p.configured || [];
    const reconnecting = p.reconnecting || [];
    document.getElementById("peers-summary").innerHTML = `
        <div style="display:flex; justify-content:space-between; padding:6px 0;"><span style="color:var(--text-dim)">${t("peers_port_label")}</span><span class="mono">${p.port ?? "—"}</span></div>
        <div style="display:flex; justify-content:space-between; padding:6px 0;"><span style="color:var(--text-dim)">${t("peers_connected_count_label")}</span><span class="mono">${connected.length}</span></div>`;
    fillList("list-connected", connected);
    fillList("list-configured", configured);
    fillList("list-reconnecting", reconnecting);
}

BBCLiveState.subscribe(({ state, live }) => {
    if (!state) return;
    try {
        renderPeers(state);
        if (!live) {
            document.getElementById("peers-summary").insertAdjacentHTML("afterbegin",
                `<div class="error-banner" style="margin-bottom:8px;">⚠ ${t("network_no_node_connection")}</div>`);
        }
    } catch (e) {
        console.error("renderPeers:", e);
    }
});
BBCLiveState.init();

document.getElementById("connect-btn").addEventListener("click", async () => {
    const addr = document.getElementById("peer-address").value.trim();
    const box = document.getElementById("connect-result");
    if (!addr) { box.innerHTML = `<div class="error-banner">${t("peers_need_address")}</div>`; return; }
    try {
        await apiPost("/peers/connect", { address: addr });
        box.innerHTML = `<p style="color:var(--leaf)">${t("peers_connecting_to")} ${escapeHtml(addr)}...</p>`;
        // Akcja nie czeka na nastepny SSE - jeden bezposredni odczyt dla natychmiastowej informacji zwrotnej.
        setTimeout(async () => {
            try { renderPeers(await apiGet("/state")); } catch (e) {}
        }, 1000);
    } catch (e) {
        box.innerHTML = `<div class="error-banner">${escapeHtml(e.message)}</div>`;
    }
});

document.addEventListener("bbc:langchange", () => {
    const s = BBCLiveState.getState();
    if (s) renderPeers(s);
});
</script>
</body>
</html>
