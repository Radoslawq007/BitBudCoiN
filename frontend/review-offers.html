<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zgłoszenia zakupu — BitBudCoin</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--font-mono); font-size: .72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .field input { width: 100%; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--leaf-dim); border-radius: 6px; padding: 9px 12px; color: var(--text); font-family: var(--font-mono); font-size: .95rem; }
  .offer-card { margin-bottom: 14px; }
  .offer-card .amounts { font-family: var(--font-mono); font-size: 1rem; color: var(--leaf); margin-bottom: 6px; }
  .offer-card .meta { font-size: .8rem; color: var(--text-dim); margin-bottom: 10px; }
  .btn-row { display: flex; gap: 8px; }
  .accept-sub { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--leaf-dim); }
  .priv-display { font-family: var(--font-mono); font-size: .75rem; color: #ffb3a8; word-break: break-all; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; border: 1px solid #ff5050; margin: 8px 0; }
  .key-warning { background: rgba(255,80,80,.1); border: 1px solid #ff5050; border-radius: 8px; padding: 10px 12px; font-size: .8rem; margin-bottom: 8px; }
  .download-key-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--surface-2); border: 2px solid var(--leaf); color: var(--leaf); border-radius: 8px; padding: 10px; font-family: var(--font-mono); font-size: .88rem; font-weight: 600; margin: 8px 0; cursor: pointer; }
  .download-key-btn.downloaded { border-color: var(--leaf-dim); color: var(--text-dim); }
  .confirm-saved-row { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; font-size: .85rem; }
  .confirm-saved-row input { margin-top: 3px; flex-shrink: 0; width: 18px; height: 18px; }
  .btn.flame:disabled { opacity: .4; cursor: not-allowed; }
  .recovered-box { background: rgba(255,80,80,.08); border: 2px solid #ff5050; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .live-error-box { background: #ff5050; color: #1a0000; border-radius: 10px; padding: 16px; margin-bottom: 16px; font-weight: 600; }
  .live-error-box h3 { margin: 0 0 8px; }
  .live-error-item { background: rgba(0,0,0,.15); border-radius: 6px; padding: 8px 10px; margin-top: 8px; font-family: var(--font-mono); font-size: .82rem; font-weight: 400; }
  .recovered-box h3 { margin-top: 0; font-size: .95rem; }
  .recovered-item { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .recovered-item .priv-display { margin: 6px 0; }
  .recovered-item-meta { font-family: var(--font-mono); font-size: .75rem; color: var(--text-dim); }
</style>
</head>
<body>

<div class="page">
    <h1 style="margin-top:32px;" data-i18n="revoffer_h1">Zgłoszenia zakupu</h1>

    <div id="liveErrorBox"></div>
    <div id="familyPendingBox"></div>
    <div id="recoveredKeysBox"></div>

    <div class="card">
        <div class="field"><label data-i18n="revoffer_secret_label">Sekret administratora</label><input id="adminSecret" type="password"></div>
        <button class="btn flame" id="loadBtn" style="width:100%;justify-content:center;" data-i18n="revoffer_load_btn">Wczytaj oczekujące</button>
    </div>

    <div id="offersList"></div>
</div>

<footer><span data-i18n="footer_text">BitBudCoin (BbC) · sieć proof-of-work</span></footer>

<script src="assets/api.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/native-responsive.js"></script>
<script src="assets/btc-bridge.js"></script>
<script src="assets/i18n.js"></script>
<script>
function randomPrivKeyBigInt() {
    let k;
    do {
        const bytes = crypto.getRandomValues(new Uint8Array(32));
        k = modN(BigInt("0x" + Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("")));
    } while (k === 0n);
    return k;
}

async function loadOffers() {
    const listEl = document.getElementById("offersList");
    listEl.innerHTML = `<p>${t("revoffer_loading")}</p>`;
    try {
        const res = await fetch(API_BASE + "/swap/offers");
        const all = await res.json();
        const pending = Object.values(all).filter((o) => o.status === "pending");

        if (pending.length === 0) {
            listEl.innerHTML = `<div class="empty-state">${t("revoffer_none_pending")}</div>`;
            return;
        }

        listEl.innerHTML = pending.map((o) => `
            <div class="card offer-card" id="offer-${o.offerId}">
                <div class="amounts">${o.expectedAmount} BTC → ${o.bbcAmount} BbC</div>
                <div class="meta">${t("revoffer_id_label")}: ${o.offerId} · ${t("revoffer_timeout_label")}: ${o.timeoutHours}h${o.note ? " · " + escapeHtml(o.note) : ""}</div>
                <div class="btn-row">
                    <button class="btn flame" data-action="accept" data-id="${o.offerId}" data-i18n="revoffer_accept_btn">Akceptuj</button>
                    <button class="btn secondary" data-action="reject" data-id="${o.offerId}" data-i18n="revoffer_reject_btn">Odrzuć</button>
                </div>
                <div class="accept-sub" id="accept-sub-${o.offerId}">
                    <div class="key-warning" data-i18n="revoffer_key_warning">⚠️ Nowy klucz BTC tylko dla tej transakcji. Zapisz — potrzebny do odebrania BTC później.</div>
                    <div class="priv-display" id="priv-${o.offerId}"></div>
                    <button class="download-key-btn" data-action="download-key" data-id="${o.offerId}">📥 <span data-i18n="revoffer_download_key">Pobierz plik z kluczem</span></button>
                    <div class="field"><label data-i18n="revoffer_bbc_address_label">Twój adres BbC (istniejący z portfela)</label><input id="bbcaddr-${o.offerId}" placeholder="BbC..."></div>
                    <label class="confirm-saved-row"><input type="checkbox" id="confirmSaved-${o.offerId}"><span data-i18n="revoffer_confirm_saved">Zapisałem/pobrałem klucz prywatny — bez niego nie odbiorę BTC.</span></label>
                    <button class="btn flame" data-action="confirm-accept" data-id="${o.offerId}" style="width:100%;justify-content:center;" disabled data-i18n="revoffer_confirm_btn">Potwierdź akceptację</button>
                    <div id="accept-result-${o.offerId}" style="margin-top:8px;font-family:var(--font-mono);font-size:.82rem;"></div>
                </div>
            </div>
        `).join("");

        document.querySelectorAll('[data-action="accept"]').forEach((btn) => {
            btn.addEventListener("click", () => showAcceptForm(btn.dataset.id));
        });
        document.querySelectorAll('[data-action="download-key"]').forEach((btn) => {
            btn.addEventListener("click", () => downloadKeyFile(btn.dataset.id));
        });
        document.querySelectorAll('[data-action="reject"]').forEach((btn) => {
            btn.addEventListener("click", () => rejectOffer(btn.dataset.id));
        });
    } catch (err) {
        listEl.innerHTML = `<div class="error-banner">${err.message}</div>`;
    }
}

let generatedKeys = {};
let unsavedKeys = new Set(); // offerId-y, ktore maja wygenerowany klucz jeszcze nie potwierdzony jako zapisany

// Dokładnie to, czego zabrakło dziś w nocy: sprawdza czy w tym urządzeniu
// leży zapomniany klucz z poprzedniej, przerwanej sesji (zamknięta karta,
// crash przeglądarki, cokolwiek) - i pokazuje go na samej górze strony,
// zanim zdąży się o nim zapomnieć na dobre.
function scanForRecoveredKeys() {
    const found = [];
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith("btc_key_backup_")) {
            try {
                const data = JSON.parse(localStorage.getItem(key));
                found.push(data);
            } catch (err) { /* pomiń uszkodzony wpis */ }
        }
    }
    const box = document.getElementById("recoveredKeysBox");
    if (found.length === 0) { box.innerHTML = ""; return; }

    box.innerHTML = `
        <div class="recovered-box">
            <h3 data-i18n="revoffer_recovered_heading">⚠️ Znaleziono zapisane klucze z poprzednich sesji</h3>
            <p style="font-size:.82rem;color:var(--text-dim);" data-i18n="revoffer_recovered_desc">Jeśli już odebrałeś BTC dla którejś z tych ofert, możesz bezpiecznie usunąć wpis.</p>
            ${found.map((k) => `
                <div class="recovered-item">
                    <div class="recovered-item-meta">${t("revoffer_id_label")}: ${k.offerId} · ${new Date(k.savedAt).toLocaleString()}</div>
                    <div class="priv-display">${k.privateKeyHex}</div>
                    <div class="btn-row">
                        <button class="btn flame" data-recover-download="${k.offerId}" style="flex:1;justify-content:center;" data-i18n="revoffer_download_key">📥 Pobierz plik z kluczem</button>
                        <button class="btn secondary" data-recover-delete="${k.offerId}" style="flex:1;justify-content:center;" data-i18n="revoffer_recovered_delete">Usuń</button>
                    </div>
                </div>
            `).join("")}
        </div>
    `;

    box.querySelectorAll("[data-recover-download]").forEach((btn) => {
        btn.addEventListener("click", () => {
            const data = found.find((k) => k.offerId === btn.dataset.recoverDownload);
            downloadKeyFileFromData(data);
        });
    });
    box.querySelectorAll("[data-recover-delete]").forEach((btn) => {
        btn.addEventListener("click", () => {
            if (!confirm(t("revoffer_recovered_confirm_delete"))) return;
            localStorage.removeItem("btc_key_backup_" + btn.dataset.recoverDelete);
            scanForRecoveredKeys();
        });
    });
}

function saveKeyToLocalStorage(offerId, priv, pubKeyHash) {
    try {
        localStorage.setItem("btc_key_backup_" + offerId, JSON.stringify({
            offerId, privateKeyHex: priv.toString(16).padStart(64, "0"), pubKeyHash, savedAt: Date.now()
        }));
    } catch (err) { /* localStorage niedostępny (np. tryb prywatny) - reszta zabezpieczeń nadal działa */ }
}

function downloadKeyFileFromData(data) {
    const content =
`BitBudCoin - klucz prywatny BTC dla oferty ${data.offerId}
Wygenerowano: ${new Date(data.savedAt).toISOString()}

KLUCZ PRYWATNY (potrzebny do odebrania BTC):
${data.privateKeyHex}

Hash klucza publicznego (już wysłany do oferty):
${data.pubKeyHash}

Nikomu nie udostępniaj tego pliku. Bez tego klucza nie da się odebrać wpłaconego BTC.
`;
    const blob = new Blob([content], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `bbc-btc-key-${data.offerId}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function downloadKeyFile(offerId) {
    const keys = generatedKeys[offerId];
    if (!keys) return;
    downloadKeyFileFromData({
        offerId, privateKeyHex: keys.priv.toString(16).padStart(64, "0"),
        pubKeyHash: keys.pubKeyHash, savedAt: Date.now()
    });

    const btn = document.querySelector(`[data-action="download-key"][data-id="${offerId}"]`);
    if (btn) { btn.classList.add("downloaded"); btn.innerHTML = "✅ <span>" + t("revoffer_downloaded") + "</span>"; }
}

async function showAcceptForm(offerId) {
    const sub = document.getElementById("accept-sub-" + offerId);
    sub.style.display = "block";

    if (!generatedKeys[offerId]) {
        const priv = randomPrivKeyBigInt();
        const pubPoint = scalarMult(priv, G);
        const pubKeyHash = bytesToHex(await hash160(compressPubKey(pubPoint)));
        generatedKeys[offerId] = { priv, pubKeyHash };
        document.getElementById("priv-" + offerId).textContent = priv.toString(16).padStart(64, "0");
        saveKeyToLocalStorage(offerId, priv, pubKeyHash);
        unsavedKeys.add(offerId);
    }

    const checkbox = document.getElementById("confirmSaved-" + offerId);
    const confirmBtn = document.querySelector(`[data-action="confirm-accept"][data-id="${offerId}"]`);
    checkbox.addEventListener("change", () => {
        confirmBtn.disabled = !checkbox.checked;
        if (checkbox.checked) unsavedKeys.delete(offerId); else unsavedKeys.add(offerId);
    });

    confirmBtn.addEventListener("click", () => confirmAccept(offerId), { once: true });
}

window.addEventListener("beforeunload", (e) => {
    if (unsavedKeys.size > 0) {
        e.preventDefault();
        e.returnValue = "";
    }
});

async function confirmAccept(offerId) {
    const secret = document.getElementById("adminSecret").value;
    const sellerBbcAddress = document.getElementById("bbcaddr-" + offerId).value.trim();
    const resultEl = document.getElementById("accept-result-" + offerId);
    if (!sellerBbcAddress) { resultEl.textContent = t("revoffer_need_bbc_address"); return; }

    try {
        const res = await fetch(API_BASE + `/swap/offers/${offerId}/accept`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ secret, sellerPubKeyHash: generatedKeys[offerId].pubKeyHash, sellerBbcAddress })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `${t("common_backend_error")} (${res.status})`);

        // Od razu oznacza tę transakcję jako "z mostu" (ten sam sekret już
        // wpisany - zero dodatkowego kroku później, explorer/portfel to
        // rozpoznają przez htlcId, jak tylko transakcja się wydarzy).
        try {
            await fetch(API_BASE + "/bridge/annotations", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ secret, htlcId: offerId, chain: "BTC", note: "swap" })
            });
        } catch (tagErr) { /* nieudane oznaczenie nie blokuje samej akceptacji */ }

        resultEl.innerHTML = `<span style="color:var(--leaf)">✅ ${t("revoffer_accepted")}</span>`;
        setTimeout(() => document.getElementById("offer-" + offerId).remove(), 1500);
    } catch (err) {
        resultEl.innerHTML = `<span style="color:var(--danger)">❌ ${err.message}</span>`;
    }
}

async function rejectOffer(offerId) {
    const secret = document.getElementById("adminSecret").value;
    try {
        const res = await fetch(API_BASE + `/swap/offers/${offerId}/reject`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ secret })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `${t("common_backend_error")} (${res.status})`);
        document.getElementById("offer-" + offerId).remove();
    } catch (err) {
        alert(err.message);
    }
}

async function checkLiveErrors() {
    try {
        const errors = await fetch(API_BASE + "/family/live-errors").then((r) => r.json());
        const box = document.getElementById("liveErrorBox");
        if (!errors || errors.length === 0) { box.innerHTML = ""; return; }
        box.innerHTML = `
            <div class="live-error-box">
                <h3>🚨 ${t("revoffer_live_error_heading")} (${errors.length})</h3>
                ${errors.map((e) => `<div class="live-error-item">${e.address.slice(0,10)}…${e.address.slice(-6)} · ${new Date(e.timestamp).toLocaleString()}<br>${escapeHtml(e.message)}</div>`).join("")}
            </div>`;
    } catch (err) { /* cicho - to nie krytyczna funkcja strony */ }
}

async function checkFamilyPending() {
    const secret = document.getElementById("adminSecret").value;
    if (!secret) return; // nie proś o sekret zanim ktoś go wpisał
    try {
        const pending = await fetch(API_BASE + "/family/pending?secret=" + encodeURIComponent(secret)).then((r) => r.json());
        const box = document.getElementById("familyPendingBox");
        if (!Array.isArray(pending) || pending.length === 0) { box.innerHTML = ""; return; }
        box.innerHTML = `
            <div class="card" style="border-color:var(--flame);">
                <h3>👨‍👩‍👧 ${t("revoffer_family_pending_heading")} (${pending.length})</h3>
                ${pending.map((m) => `
                    <div class="live-error-item" style="background:var(--surface-2);color:var(--text);">
                        ${m.address.slice(0,10)}…${m.address.slice(-6)} · ${new Date(m.timestamp).toLocaleString()}<br>${escapeHtml(m.message)}
                        <div class="btn-row" style="margin-top:8px;">
                            <button class="btn flame" data-family-approve="${m.id}">${t("revoffer_family_approve")}</button>
                            <button class="btn secondary" data-family-reject="${m.id}">${t("revoffer_family_reject")}</button>
                        </div>
                    </div>
                `).join("")}
            </div>`;
        box.querySelectorAll("[data-family-approve]").forEach((btn) => {
            btn.addEventListener("click", () => reviewFamilyMessage(btn.dataset.familyApprove, "approve"));
        });
        box.querySelectorAll("[data-family-reject]").forEach((btn) => {
            btn.addEventListener("click", () => reviewFamilyMessage(btn.dataset.familyReject, "reject"));
        });
    } catch (err) { /* cicho */ }
}

async function reviewFamilyMessage(id, decision) {
    const secret = document.getElementById("adminSecret").value;
    try {
        await fetch(API_BASE + `/family/pending/${id}/review`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ secret, decision })
        });
        checkFamilyPending();
    } catch (err) { alert(err.message); }
}

document.getElementById("loadBtn").addEventListener("click", loadOffers);
scanForRecoveredKeys();
checkLiveErrors();
document.getElementById("adminSecret").addEventListener("blur", checkFamilyPending);
</script>
</body>
</html>
