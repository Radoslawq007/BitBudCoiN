<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zgłoszenia zakupu — BitBudCoin</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--font-mono); font-size: .72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .field input { width: 100%; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--leaf-dim); border-radius: 6px; padding: 9px 12px; color: var(--text); font-family: var(--font-mono); font-size: .95rem; }
  .offer-card { margin-bottom: 14px; }
  .offer-card .amounts { font-family: var(--font-mono); font-size: 1rem; color: var(--leaf); margin-bottom: 6px; }
  .offer-card .meta { font-size: .8rem; color: var(--text-dim); margin-bottom: 10px; }
  .btn-row { display: flex; gap: 8px; }
  .accept-sub { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--leaf-dim); }
  .priv-display { font-family: var(--font-mono); font-size: .75rem; color: #ffb3a8; word-break: break-all; background: var(--surface-2); padding: 10px 12px; border-radius: 8px; border: 1px solid #ff5050; margin: 8px 0; }
  .key-warning { background: rgba(255,80,80,.1); border: 1px solid #ff5050; border-radius: 8px; padding: 10px 12px; font-size: .8rem; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="page">
    <h1 style="margin-top:32px;" data-i18n="revoffer_h1">Zgłoszenia zakupu</h1>

    <div class="card">
        <div class="field"><label data-i18n="revoffer_secret_label">Sekret administratora</label><input id="adminSecret" type="password"></div>
        <button class="btn flame" id="loadBtn" style="width:100%;justify-content:center;" data-i18n="revoffer_load_btn">Wczytaj oczekujące</button>
    </div>

    <div id="offersList"></div>
</div>

<footer><span data-i18n="footer_text">BitBudCoin (BbC) · sieć proof-of-work</span></footer>

<script src="assets/api.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/native-responsive.js"></script>
<script src="assets/btc-bridge.js"></script>
<script src="assets/i18n.js"></script>
<script>
function randomPrivKeyBigInt() {
    let k;
    do {
        const bytes = crypto.getRandomValues(new Uint8Array(32));
        k = modN(BigInt("0x" + Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("")));
    } while (k === 0n);
    return k;
}

async function loadOffers() {
    const listEl = document.getElementById("offersList");
    listEl.innerHTML = `<p>${t("revoffer_loading")}</p>`;
    try {
        const res = await fetch(API_BASE + "/swap/offers");
        const all = await res.json();
        const pending = Object.values(all).filter((o) => o.status === "pending");

        if (pending.length === 0) {
            listEl.innerHTML = `<div class="empty-state">${t("revoffer_none_pending")}</div>`;
            return;
        }

        listEl.innerHTML = pending.map((o) => `
            <div class="card offer-card" id="offer-${o.offerId}">
                <div class="amounts">${o.expectedAmount} BTC → ${o.bbcAmount} BbC</div>
                <div class="meta">${t("revoffer_id_label")}: ${o.offerId} · ${t("revoffer_timeout_label")}: ${o.timeoutHours}h${o.note ? " · " + escapeHtml(o.note) : ""}</div>
                <div class="btn-row">
                    <button class="btn flame" data-action="accept" data-id="${o.offerId}" data-i18n="revoffer_accept_btn">Akceptuj</button>
                    <button class="btn secondary" data-action="reject" data-id="${o.offerId}" data-i18n="revoffer_reject_btn">Odrzuć</button>
                </div>
                <div class="accept-sub" id="accept-sub-${o.offerId}">
                    <div class="key-warning" data-i18n="revoffer_key_warning">⚠️ Nowy klucz BTC tylko dla tej transakcji. Zapisz — potrzebny do odebrania BTC później.</div>
                    <div class="priv-display" id="priv-${o.offerId}"></div>
                    <div class="field"><label data-i18n="revoffer_bbc_address_label">Twój adres BbC (istniejący z portfela)</label><input id="bbcaddr-${o.offerId}" placeholder="BbC..."></div>
                    <button class="btn flame" data-action="confirm-accept" data-id="${o.offerId}" style="width:100%;justify-content:center;" data-i18n="revoffer_confirm_btn">Potwierdź akceptację</button>
                    <div id="accept-result-${o.offerId}" style="margin-top:8px;font-family:var(--font-mono);font-size:.82rem;"></div>
                </div>
            </div>
        `).join("");

        document.querySelectorAll('[data-action="accept"]').forEach((btn) => {
            btn.addEventListener("click", () => showAcceptForm(btn.dataset.id));
        });
        document.querySelectorAll('[data-action="reject"]').forEach((btn) => {
            btn.addEventListener("click", () => rejectOffer(btn.dataset.id));
        });
    } catch (err) {
        listEl.innerHTML = `<div class="error-banner">${err.message}</div>`;
    }
}

let generatedKeys = {};

async function showAcceptForm(offerId) {
    const sub = document.getElementById("accept-sub-" + offerId);
    sub.style.display = "block";

    if (!generatedKeys[offerId]) {
        const priv = randomPrivKeyBigInt();
        const pubPoint = scalarMult(priv, G);
        const pubKeyHash = bytesToHex(await hash160(compressPubKey(pubPoint)));
        generatedKeys[offerId] = { priv, pubKeyHash };
        document.getElementById("priv-" + offerId).textContent = priv.toString(16).padStart(64, "0");
    }

    document.querySelector(`[data-action="confirm-accept"][data-id="${offerId}"]`).addEventListener("click", () => confirmAccept(offerId), { once: true });
}

async function confirmAccept(offerId) {
    const secret = document.getElementById("adminSecret").value;
    const sellerBbcAddress = document.getElementById("bbcaddr-" + offerId).value.trim();
    const resultEl = document.getElementById("accept-result-" + offerId);
    if (!sellerBbcAddress) { resultEl.textContent = t("revoffer_need_bbc_address"); return; }

    try {
        const res = await fetch(API_BASE + `/swap/offers/${offerId}/accept`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ secret, sellerPubKeyHash: generatedKeys[offerId].pubKeyHash, sellerBbcAddress })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `${t("common_backend_error")} (${res.status})`);
        resultEl.innerHTML = `<span style="color:var(--leaf)">✅ ${t("revoffer_accepted")}</span>`;
        setTimeout(() => document.getElementById("offer-" + offerId).remove(), 1500);
    } catch (err) {
        resultEl.innerHTML = `<span style="color:var(--danger)">❌ ${err.message}</span>`;
    }
}

async function rejectOffer(offerId) {
    const secret = document.getElementById("adminSecret").value;
    try {
        const res = await fetch(API_BASE + `/swap/offers/${offerId}/reject`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ secret })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `${t("common_backend_error")} (${res.status})`);
        document.getElementById("offer-" + offerId).remove();
    } catch (err) {
        alert(err.message);
    }
}

document.getElementById("loadBtn").addEventListener("click", loadOffers);
</script>
</body>
</html>
