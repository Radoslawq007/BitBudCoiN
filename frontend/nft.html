<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legendarne BitBud — BitBudCoin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{--ink:#140b22;--ink2:#1f1233;--gold:#f2b84b;--ember:#ff6a3d;--ice:#7fe3ff;--bone:#f6efe2;--mute:#a99cc2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 700px at 50% -10%,#3a1d63 0%,transparent 60%),var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{max-width:1000px;margin:0 auto;padding:44px 20px 20px}
h1{font:800 clamp(34px,8vw,64px)/1.02 Fraunces,Georgia,serif;margin:0 0 10px;letter-spacing:-.02em;background:linear-gradient(100deg,var(--gold),#fff3c9 40%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--mute);max-width:56ch}
.bar{max-width:1000px;margin:0 auto;padding:8px 20px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 260px;min-width:0;background:var(--ink2);border:1px solid #3b2a5c;color:var(--bone);border-radius:10px;padding:11px 12px;font:14px ui-monospace,Menlo,monospace}
.bar button{background:var(--gold);color:#2a1700;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.bar button.ghost{background:transparent;color:var(--bone);border:1px solid #3b2a5c}
:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.count{color:var(--mute);font-size:14px;margin-left:auto}
#grid{max-width:1000px;margin:0 auto;padding:10px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:18px;perspective:1000px}
.msg{max-width:1000px;margin:0 auto;padding:30px 20px;color:var(--mute)}
.msg code{background:var(--ink2);padding:2px 6px;border-radius:6px;color:var(--bone);word-break:break-all}
.card{position:relative;aspect-ratio:5/7;border-radius:18px;padding:0;border:0;cursor:pointer;color:inherit;text-align:left;
 background:linear-gradient(160deg,#2a1748,#150c26);transform-style:preserve-3d;
 transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .3s;
 box-shadow:0 0 0 1.5px #d9a43a,0 18px 40px #0009,0 0 36px #f2b84b33;overflow:hidden;-webkit-tap-highlight-color:transparent}
.card .art{position:absolute;inset:10px 10px 38%;border-radius:12px;overflow:hidden;background:#0d0719}
.card .art svg,.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .txt{position:absolute;left:14px;right:14px;bottom:12px}
.card h3{font:800 clamp(14px,3.8vw,18px)/1.15 Fraunces,Georgia,serif;margin:0 0 6px;overflow-wrap:anywhere}
.card .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--gold)}
.card .holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;border-radius:inherit;
 background:linear-gradient(115deg,transparent 20%,#ff6a3d66 32%,#f2b84b88 40%,#7fe3ff77 50%,#b57cff66 60%,transparent 72%);
 background-size:250% 250%;background-position:calc(var(--mx,50%)) calc(var(--my,50%))}
.card .glare{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
 background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#ffffff55,transparent 45%)}
.card:hover,.card:focus-visible{box-shadow:0 0 0 1.5px #ffd877,0 24px 50px #000a,0 0 60px #f2b84b66}
dialog{border:0;padding:0;background:transparent;color:var(--bone);max-width:min(440px,94vw);width:100%;overflow:visible}
dialog::backdrop{background:#0b0614e8;backdrop-filter:blur(6px)}
.sheet{background:var(--ink2);border:1px solid #3b2a5c;border-radius:20px;padding:20px;position:relative}
.sheet .card{width:min(260px,70%);margin:6px auto 18px;display:block;cursor:default}
.sheet h2{font:800 26px/1.1 Fraunces,Georgia,serif;margin:0 0 8px}
.sheet p{margin:0 0 12px;color:#d9cfee;overflow-wrap:anywhere}
.sheet dl{margin:0;font-size:13px;color:var(--mute)}
.sheet dd{margin:0 0 10px;color:var(--bone);font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.sheet .x{position:absolute;top:10px;right:10px;background:#0006;color:var(--bone);border:1px solid #3b2a5c;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
header{position:relative}
.langs{position:absolute;top:14px;right:20px;display:flex}
.langs[hidden]{display:none}
.langs .lang-switch-btn{padding:6px 11px;font:600 .72rem ui-monospace,Menlo,monospace;border:1px solid #3b2a5c;background:var(--ink2);color:var(--mute);cursor:pointer}
.langs .lang-switch-btn:first-child{border-radius:8px 0 0 8px}
.langs .lang-switch-btn:last-child{border-radius:0 8px 8px 0;border-left:none}
.langs .lang-switch-btn.active{background:var(--gold);color:#2a1700;border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header>
  <div class="langs" id="langs" hidden>
    <button type="button" class="lang-switch-btn" data-lang="pl" aria-pressed="false" aria-label="Polski">PL</button>
    <button type="button" class="lang-switch-btn" data-lang="en" aria-pressed="false" aria-label="English">EN</button>
  </div>
  <h1 data-i18n="nft_h1">Legendarne BitBud</h1>
  <p data-i18n="nft_intro">Kolekcja wybita przez właściciela węzła BitBudCoin. Każdy token ma jednego właściciela, a każde zdarzenie trafia do dziennika ze skrótami łańcuchowymi.</p>
</header>
<div class="bar">
  <input id="owner" placeholder="Twój adres NFT (NFT + 40 znaków) — pokaż tylko moje" data-i18n-placeholder="nft_owner_placeholder" aria-label="Adres NFT właściciela" data-i18n-aria-label="nft_owner_label" autocomplete="off" spellcheck="false">
  <button id="filter" data-i18n="nft_btn_mine">Pokaż moje</button>
  <button id="all" class="ghost" data-i18n="nft_btn_all">Wszystkie</button>
  <span class="count" id="count"></span>
</div>
<main id="grid" aria-live="polite"></main>
<div id="status" class="msg">Ładowanie kolekcji…</div>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<canvas id="fx"></canvas>
<script src="assets/i18n.js"></script>
<script>
(function(){
'use strict';
/* ---- Tłumaczenia tej strony: dopisywane do słownika z assets/i18n.js (bez zmiany tamtego pliku) ---- */
var DICT={
  pl:{
    nft_title:'Legendarne BitBud — BitBudCoin',
    nft_h1:'Legendarne BitBud',
    nft_intro:'Kolekcja wybita przez właściciela węzła BitBudCoin. Każdy token ma jednego właściciela, a każde zdarzenie trafia do dziennika ze skrótami łańcuchowymi.',
    nft_owner_placeholder:'Twój adres NFT (NFT + 40 znaków) — pokaż tylko moje',
    nft_owner_label:'Adres NFT właściciela',
    nft_btn_mine:'Pokaż moje', nft_btn_all:'Wszystkie',
    nft_count:'{n} w kolekcji',
    nft_loading:'Ładowanie kolekcji…',
    nft_empty:'Brak tokenów. Pierwszy wybijesz na serwerze: ',
    nft_err_api:'Nie mogę połączyć się z API ({msg}). Sprawdź, czy serwer działa i czy nft.js jest podpięty. Adres: {api}',
    nft_err_addr:'Zły adres. Oczekiwane: NFT + 40 znaków hex.',
    nft_open_aria:'Otwórz {name}, numer {id}',
    nft_close:'Zamknij', nft_no_desc:'Bez opisu.',
    nft_owner:'Właściciel', nft_minted:'Wybity', nft_number:'Numer',
    nft_rarity_Legendary:'Legendarny'
  },
  en:{
    nft_title:'Legendary BitBud — BitBudCoin',
    nft_h1:'Legendary BitBud',
    nft_intro:'A collection minted by the owner of the BitBudCoin node. Every token has exactly one owner, and every event goes into a log with chained hashes.',
    nft_owner_placeholder:'Your NFT address (NFT + 40 characters) — show only mine',
    nft_owner_label:'Owner NFT address',
    nft_btn_mine:'Show mine', nft_btn_all:'All',
    nft_count:'{n} in the collection',
    nft_loading:'Loading the collection…',
    nft_empty:'No tokens yet. You mint the first one on the server: ',
    nft_err_api:"Can't reach the API ({msg}). Check that the server is running and nft.js is mounted. Address: {api}",
    nft_err_addr:'Invalid address. Expected: NFT + 40 hex characters.',
    nft_open_aria:'Open {name}, number {id}',
    nft_close:'Close', nft_no_desc:'No description.',
    nft_owner:'Owner', nft_minted:'Minted', nft_number:'Number',
    nft_rarity_Legendary:'Legendary'
  }
};
if(window.BbCI18n&&BbCI18n.getTranslations){var TR=BbCI18n.getTranslations();Object.assign(TR.pl,DICT.pl);Object.assign(TR.en,DICT.en)}
/* T(): t() z i18n.js; gdyby tamten plik się nie wczytał — działa po polsku */
function T(k,r){
  if(typeof window.t==='function'){return window.t(k,r||{})}
  var v=DICT.pl[k]!==undefined?DICT.pl[k]:k;r=r||{};
  Object.keys(r).forEach(function(n){v=v.split('{'+n+'}').join(String(r[n]))});return v;
}
function lang(){return window.BbCI18n?BbCI18n.getLanguage():'pl'}
function locale(){return lang()==='en'?'en-GB':'pl-PL'}
if(window.BbCI18n){document.getElementById('langs').hidden=false;
  document.querySelectorAll('.langs .lang-switch-btn').forEach(function(b){b.addEventListener('click',function(){BbCI18n.setLanguage(b.dataset.lang)})})}
var S={list:null,total:0,status:{kind:'loading'},openToken:null};
'use strict';
var API=(new URLSearchParams(location.search).get('api')||'https://141-147-98-57.sslip.io').replace(/\/+$/,'')+'/api/nft';
var $=function(i){return document.getElementById(i)};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function NS(n,a){var e=document.createElementNS('http://www.w3.org/2000/svg',n);for(var k in a)e.setAttribute(k,a[k]);return e}
function art(id){
  var r=rng(id*7919+13),h=30+Math.floor(r()*40),s=NS('svg',{viewBox:'0 0 200 160',preserveAspectRatio:'xMidYMid slice'});
  var d=NS('defs',{}),g=NS('radialGradient',{id:'g'+id,cx:'50%',cy:'45%',r:'70%'});
  [['0','hsl('+h+',95%,62%)'],['.55','hsl('+(h+200)+',70%,30%)'],['1','#0d0719']].forEach(function(x){g.appendChild(NS('stop',{offset:x[0],'stop-color':x[1]}))});
  d.appendChild(g);s.appendChild(d);s.appendChild(NS('rect',{width:200,height:160,fill:'url(#g'+id+')'}));
  for(var i=0;i<26;i++)s.appendChild(NS('circle',{cx:r()*200,cy:r()*160,r:r()*1.6+.3,fill:'#fff','fill-opacity':(r()*.7+.2).toFixed(2)}));
  var n=5+Math.floor(r()*3),pts=[],cx=100,cy=84;
  for(var j=0;j<n;j++){var a=j/n*Math.PI*2-Math.PI/2,rad=44+r()*18;pts.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad*1.15])}
  for(var k=0;k<n;k++){var p=pts[k],q=pts[(k+1)%n];
    s.appendChild(NS('polygon',{points:cx+','+cy+' '+p.join(',')+' '+q.join(','),fill:'hsl('+(h+k*14)+',90%,'+(38+r()*34)+'%)','fill-opacity':.92,stroke:'#fff3c9','stroke-opacity':.55,'stroke-width':.8}))}
  return s;
}
function artEl(t){
  var box=document.createElement('div');box.className='art';
  if(t.image&&/^https:\/\//.test(t.image)){var im=new Image();im.alt=t.name;im.referrerPolicy='no-referrer';im.onerror=function(){box.textContent='';box.appendChild(art(t.id))};im.src=t.image;box.appendChild(im)}
  else box.appendChild(art(t.id));
  return box;
}
function rarityLabel(r){var k='nft_rarity_'+r,v=T(k);return v===k?r:v}
function cardEl(t,tag){
  var c=document.createElement(tag||'button');c.className='card';if(c.tagName==='BUTTON')c.type='button';
  c.appendChild(artEl(t));
  var x=document.createElement('div');x.className='txt';
  var h=document.createElement('h3');h.textContent=t.name;x.appendChild(h);
  var m=document.createElement('div');m.className='meta';
  var a=document.createElement('span');a.textContent=rarityLabel(t.rarity);var b=document.createElement('span');b.textContent='#'+t.id;
  m.appendChild(a);m.appendChild(b);x.appendChild(m);c.appendChild(x);
  var ho=document.createElement('div');ho.className='holo';var gl=document.createElement('div');gl.className='glare';c.appendChild(ho);c.appendChild(gl);
  if(c.tagName==='BUTTON')c.setAttribute('aria-label',T('nft_open_aria',{name:t.name,id:t.id}));
  tilt(c);return c;
}
function tilt(c){
  if(reduce)return;
  function set(px,py){var r=c.getBoundingClientRect(),x=(px-r.left)/r.width,y=(py-r.top)/r.height;
    c.style.setProperty('--ry',((x-.5)*22).toFixed(1)+'deg');c.style.setProperty('--rx',((.5-y)*22).toFixed(1)+'deg');
    c.style.setProperty('--mx',(x*100).toFixed(0)+'%');c.style.setProperty('--my',(y*100).toFixed(0)+'%')}
  function reset(){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');c.style.setProperty('--mx','50%');c.style.setProperty('--my','50%')}
  c.addEventListener('pointermove',function(e){set(e.clientX,e.clientY)});
  c.addEventListener('pointerleave',reset);
  c._set=set;
}
// żyroskop (Android działa od razu; iOS wymaga zgody, więc tam zostaje dotyk)
var cards=[];
window.addEventListener('deviceorientation',function(e){
  if(reduce||e.gamma==null||e.beta==null)return;
  var x=Math.max(-1,Math.min(1,e.gamma/30)),y=Math.max(-1,Math.min(1,(e.beta-45)/30));
  cards.forEach(function(c){var r=c.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;c._set(r.left+r.width*(.5+x*.5),r.top+r.height*(.5+y*.5))})
});

// jedna sekwencja "wow": iskry przy otwarciu tokenu
function burst(){
  if(reduce)return;var cv=$('fx'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  var P=[],ox=innerWidth/2,oy=innerHeight*.42,cols=['#f2b84b','#ff6a3d','#fff3c9','#7fe3ff'];
  for(var i=0;i<110;i++){var a=Math.random()*Math.PI*2,v=2+Math.random()*7;P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,c:cols[i%4],s:1+Math.random()*2.5})}
  (function f(){cx.clearRect(0,0,cv.width,cv.height);var alive=0;
    P.forEach(function(p){if(p.l<=0)return;alive++;p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.985;p.l-=.014;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.3);cx.fill()});
    if(alive)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height)})();
}
function row(dl,k,v){var dt=document.createElement('dt');dt.textContent=k;var dd=document.createElement('dd');dd.textContent=v;dl.appendChild(dt);dl.appendChild(dd)}
function fillSheet(t){
  var s=$('sheet');s.textContent='';
  var x=document.createElement('button');x.className='x';x.type='button';x.textContent='✕';x.setAttribute('aria-label',T('nft_close'));x.onclick=function(){$('dlg').close()};
  s.appendChild(x);s.appendChild(cardEl(t,'div'));
  var h=document.createElement('h2');h.textContent=t.name;s.appendChild(h);
  var p=document.createElement('p');p.textContent=t.description||T('nft_no_desc');s.appendChild(p);
  var dl=document.createElement('dl');row(dl,T('nft_owner'),t.owner);row(dl,T('nft_minted'),new Date(t.mintedAt).toLocaleString(locale()));row(dl,T('nft_number'),String(t.id));s.appendChild(dl);
}
function open(t){S.openToken=t;fillSheet(t);$('dlg').showModal();burst()}
$('dlg').addEventListener('close',function(){S.openToken=null});
$('dlg').addEventListener('click',function(e){if(e.target===this)this.close()});

function paintGrid(){
  var g=$('grid');g.textContent='';cards=[];
  (S.list||[]).forEach(function(t){var c=cardEl(t);c.onclick=function(){open(t)};g.appendChild(c);cards.push(c)});
  $('count').textContent=S.list?T('nft_count',{n:S.total}):'';
}
function paintStatus(){
  var st=$('status'),k=S.status&&S.status.kind;
  if(!k){st.style.display='none';return}
  st.style.display='block';st.textContent='';
  if(k==='loading')st.textContent=T('nft_loading');
  else if(k==='badaddr')st.textContent=T('nft_err_addr');
  else if(k==='error')st.textContent=T('nft_err_api',{msg:S.status.msg,api:API});
  else if(k==='empty'){st.append(T('nft_empty'));var cd=document.createElement('code');cd.textContent='node nft.js mint <adres> "Nazwa" "Opis"';st.appendChild(cd)}
}
function render(list,total){
  S.list=list;S.total=total;S.status=list.length?null:{kind:'empty'};
  paintGrid();paintStatus();
}
function load(owner){
  S.status={kind:'loading'};paintStatus();
  fetch(API+'/list'+(owner?'?owner='+encodeURIComponent(owner):''),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(d){render(d.tokens,d.total)})
    .catch(function(e){S.list=null;S.status={kind:'error',msg:e.message};paintGrid();paintStatus()});
}
document.addEventListener('bbc:langchange',function(){
  document.title=T('nft_title');
  paintGrid();paintStatus();
  if(S.openToken&&$('dlg').open)fillSheet(S.openToken);
});
document.title=T('nft_title');
try{$('owner').value=localStorage.getItem('bbc_nft_owner')||''}catch(e){}
$('filter').onclick=function(){var v=$('owner').value.trim();if(v&&!/^NFT[0-9a-f]{40}$/.test(v)){S.status={kind:'badaddr'};paintStatus();return}
  try{localStorage.setItem('bbc_nft_owner',v)}catch(e){}load(v)};
$('all').onclick=function(){load('')};
load('');
})();
</script>
</body>
</html>
